name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npm exec -- playwright-core install --with-deps chromium

      - name: Typecheck and build
        run: npm run verify

      - name: Browser smoke
        run: npm run test:browser

      - name: Build static release
        run: npm run release

      - name: Verify release artifact
        run: npm run verify:release

      - name: Validate Cloudflare package
        run: npm exec -- wrangler deploy --dry-run
